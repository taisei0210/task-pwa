<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>タスク</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f7f8fa; --card: #fff; --fg: #1a1d21; --sub: #6b7280;
    --line: #e5e7eb; --accent: #1f6feb; --danger: #dc2626; --late: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #171a20; --fg: #e6e8eb; --sub: #9aa1ac;
            --line: #262b33; --accent: #4c8dff; --late: #f0b429; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px);
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 12px 14px; }
  header { display: flex; align-items: baseline; gap: 10px; padding: 4px 2px 12px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .02em; }
  .count { color: var(--sub); font-size: 13px; }
  .sync { margin-left: auto; font-size: 11px; color: var(--sub); }
  .sync.pending { color: var(--late); }

  .composer { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 16px; }
  .composer input[type=text] {
    width: 100%; border: 0; background: transparent; color: var(--fg);
    font-size: 16px; padding: 8px 6px; outline: none;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.add { margin-left: auto; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 6px 18px; }
  .chip.add:disabled { opacity: .35; }
  input[type=date] { border: 1px solid var(--line); background: transparent; color: var(--fg);
    border-radius: 999px; padding: 5px 10px; font-size: 13px; }
  .chip.tsel { -webkit-appearance: none; appearance: none; text-align: center; }
  .chip.tsel:disabled { opacity: .35; }
  .chip.tsel option { color: var(--fg); background: var(--card); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px;
    margin-bottom: 8px; transition: opacity .18s, transform .18s;
  }
  li.going { opacity: 0; transform: translateX(40px); }
  .tick {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--sub); background: transparent; cursor: pointer;
  }
  .tick:active { background: var(--accent); border-color: var(--accent); }
  .name { flex: 1; font-size: 15px; line-height: 1.4; word-break: break-word; cursor: text; }
  /* 名前をタップすると、その場で入力欄に変わる（あとから名前を変えられる） */
  .nameedit {
    flex: 1; min-width: 0; font-size: 15px; line-height: 1.4; font-family: inherit;
    color: var(--fg); background: transparent; padding: 2px 6px;
    border: 0; border-bottom: 1.5px solid var(--accent); border-radius: 0; outline: none;
  }
  /* 行の日付：タップすると日付を変えられる（透明な date 入力を上に重ねている） */
  .whenwrap { position: relative; display: inline-flex; align-items: center; flex: 0 0 auto; }
  .whenwrap input.rowdate, .whenwrap select.rowtime {
    position: absolute; left: -6px; right: -4px; top: -12px; bottom: -12px;
    width: auto; height: auto; opacity: 0; border: 0; padding: 0; margin: 0;
    background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .when { font-size: 11px; color: var(--sub); white-space: nowrap;
    border: 1px dashed transparent; border-radius: 999px; padding: 3px 6px; }
  .when.late { color: var(--late); }
  .when.nodate { border-color: var(--line); opacity: .75; }
  .del { border: 0; background: transparent; color: var(--sub); font-size: 17px; cursor: pointer; padding: 4px 2px; }

  .empty { text-align: center; color: var(--sub); padding: 48px 0; font-size: 14px; }
  .later-head {
    width: 100%; text-align: left; background: transparent; border: 0; color: var(--sub);
    font-size: 13px; padding: 16px 4px 8px; cursor: pointer;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 18px);
    background: #1a1d21; color: #fff; border-radius: 999px; padding: 11px 16px;
    font-size: 13px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { background: transparent; border: 0; color: #7ab7ff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .setup { padding: 40px 4px; }
  .setup input { width: 100%; padding: 12px; font-size: 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .setup button { margin-top: 12px; padding: 11px 20px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .setup p { color: var(--sub); font-size: 13px; line-height: 1.7; }
  .gear { border: 0; background: transparent; color: var(--sub); cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">取り消す</button></div>

<script>
(function () {
  'use strict';

  var K_API = 'tm.api', K_TASKS = 'tm.tasks', K_QUEUE = 'tm.queue';
  var UNDO_MS = 4000;
  var BUILD = '2026-10-20a';   // 画面下に出る。どの版が動いているかの確認用

  var api = localStorage.getItem(K_API) || '';
  var tasks = load(K_TASKS, []);
  var queue = load(K_QUEUE, []);
  var pickedDate = '';       // 'yyyy-mm-dd' or ''
  var pickedTime = '';       // 'HH:00' or ''（日付を選んだときだけ意味を持つ）
  var draft = '';            // 入力途中の文字（描き直しで消えないように保持する）
  var editingId = null;      // 名前を編集中の行のID（描き直しても編集状態を保つ）
  var editDraft = '';        // 編集中の名前
  var rendering = false;     // 描き直し中。Chromeは消える直前の入力欄に blur を出すので、それを「確定」と誤認しないため
  var showLater = false;
  var flushTimer = null;
  var undoTimer = null;
  var pendingUndo = null;
  var localRev = 0;          // 端末側で変更するたびに増やす。取得中に変更があったら、その取得結果は古いので捨てる
  var inflight = null;       // 送信中の操作。送信済みの中身を書き換えても届かないので、patch は触らない

  // ---------- utils ----------
  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
  function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
  function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /** 末尾の日付表現を切り出す： 明日 / 明後日 / 来週 / 今日 / 8/24 / +3 */
  function parseTail(text) {
    var t = text.trim();
    var rules = [
      [/[\s　]*(今日|きょう)$/, 0], [/[\s　]*(明日|あした|あす)$/, 1],
      [/[\s　]*(明後日|あさって)$/, 2], [/[\s　]*(来週|らいしゅう)$/, 7]
    ];
    for (var i = 0; i < rules.length; i++) {
      if (rules[i][0].test(t)) return { name: t.replace(rules[i][0], '').trim(), date: addDays(rules[i][1]) };
    }
    var p = t.match(/[\s　]*\+(\d{1,3})$/);
    if (p) return { name: t.replace(/[\s　]*\+(\d{1,3})$/, '').trim(), date: addDays(parseInt(p[1], 10)) };
    var md = t.match(/[\s　]*(\d{1,2})[\/月](\d{1,2})日?$/);
    if (md) {
      var now = new Date(), y = now.getFullYear();
      var cand = new Date(y, parseInt(md[1], 10) - 1, parseInt(md[2], 10));
      if (ymd(cand) < today()) cand.setFullYear(y + 1);   // 過ぎてたら来年
      return { name: t.replace(/[\s　]*(\d{1,2})[\/月](\d{1,2})日?$/, '').trim(), date: ymd(cand) };
    }
    return { name: t, date: '' };
  }

  /** 有効化の瞬間を比較用の文字列にする（'yyyy-mm-dd HH:00'）。時刻なしは0時＝その日の始まり */
  function stampOf(x) { return x.date ? x.date + ' ' + (x.time || '00:00') : ''; }
  function stampNow() { var d = new Date(); return ymd(d) + ' ' + pad(d.getHours()) + ':00'; }
  /** 表示してよいか：日付なし、または有効化の瞬間を過ぎている */
  function isActive(x) { return !x.date || stampOf(x) <= stampNow(); }
  function isLate(x) { return !!x.date && stampOf(x) < stampNow(); }

  function label(date) {
    if (!date) return '';
    var t = today();
    if (date === t) return '今日';
    if (date === addDays(1)) return '明日';
    var p = date.split('-');
    return Number(p[1]) + '/' + Number(p[2]);
  }
  function timeLabel(time) { return time ? Number(time.slice(0, 2)) + '時' : ''; }

  /** 1時間ごとの選択肢 */
  function hourOptions(sel) {
    var s = '<option value=""' + (sel ? '' : ' selected') + '>時刻なし</option>';
    for (var h = 0; h < 24; h++) {
      var v = pad(h) + ':00';
      s += '<option value="' + v + '"' + (sel === v ? ' selected' : '') + '>' + h + '時</option>';
    }
    return s;
  }

  // ---------- 同期 ----------
  function enqueue(op) { localRev++; queue.push(op); save(K_QUEUE, queue); scheduleFlush(UNDO_MS); }

  function scheduleFlush(ms) {
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, ms);
    render();
  }

  function flush() {
    if (!api || !queue.length || !navigator.onLine) { render(); return; }
    if (inflight) return;                 // 二重送信しない（終わったら続きを送る）
    var op = inflight = queue[0];
    post(op).then(function (res) {
      inflight = null;
      if (res && res.ok) {
        var i = queue.indexOf(op);
        if (i >= 0) { queue.splice(i, 1); save(K_QUEUE, queue); }
        if (queue.length) flush(); else { render(); pull(); }
      } else { scheduleFlush(15000); }
    }).catch(function () { inflight = null; scheduleFlush(15000); });
  }

  function post(body) {
    // Content-Type を text/plain にしないと preflight が飛んで Apps Script が弾かれる
    return fetch(api, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  function pull() {
    if (!api || queue.length || !navigator.onLine) return;
    var rev = localRev;
    fetch(api, { redirect: 'follow' }).then(function (r) { return r.json(); })
      .then(function (res) {
        // 取得中に追加・修正・完了した分はサーバーにまだ無い。上書きすると一瞬消えるので捨てる
        // （その変更の送信が終わったら、もう一度取りに行く）
        if (rev !== localRev || queue.length) return;
        if (res && res.ok) { tasks = res.tasks; save(K_TASKS, tasks); render(); }
      }).catch(function () {});
  }

  // ---------- 操作 ----------
  function addTask() {
    var box = document.getElementById('txt');
    var raw = box.value.trim();
    if (!raw) return;
    var parsed = pickedDate ? { name: raw, date: pickedDate } : parseTail(raw);
    if (!parsed.name) return;
    var task = { id: newId(), name: parsed.name, date: parsed.date || '',
                 time: (pickedDate && parsed.date) ? pickedTime : '' };
    tasks.push(task); save(K_TASKS, tasks);
    box.value = ''; draft = ''; pickedDate = ''; pickedTime = '';
    enqueue({ action: 'add', id: task.id, name: task.name, date: task.date, time: task.time });
    box.focus();
  }

  function doneTask(id) {
    var t = tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    tasks = tasks.filter(function (x) { return x.id !== id; }); save(K_TASKS, tasks);
    enqueue({ action: 'done', id: id });
    offerUndo('完了しました', t, 'done');
  }

  /** 追加後に有効化日時を変える。未送信の add/update があればそれを書き換えて重複送信を避ける */
  function patch(id, fields) {
    var t = tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    var changed = false;
    if ('name' in fields) {
      var nm = String(fields.name || '').trim();
      if (nm && nm !== t.name) { t.name = nm; changed = true; }
    }
    if ('date' in fields && t.date !== (fields.date || '')) {
      t.date = fields.date || '';
      if (!t.date) t.time = '';          // 日付がなければ時刻は意味を持たない
      changed = true;
    }
    if ('time' in fields && t.date && t.time !== (fields.time || '')) {
      t.time = fields.time || ''; changed = true;
    }
    if (!changed) return;
    save(K_TASKS, tasks); localRev++;
    for (var i = queue.length - 1; i >= 0; i--) {
      if (queue[i] === inflight) break;   // 送信中のものは書き換えても届かない → 新しく update を積む
      if (queue[i].id === id && (queue[i].action === 'add' || queue[i].action === 'update')) {
        queue[i].name = t.name; queue[i].date = t.date; queue[i].time = t.time;
        save(K_QUEUE, queue); scheduleFlush(UNDO_MS); return;   // scheduleFlush が描き直す
      }
    }
    enqueue({ action: 'update', id: id, name: t.name, date: t.date, time: t.time });
  }

  /** 名前の編集を始める／確定する／やめる */
  function startEdit(id) {
    var t = tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    editingId = id; editDraft = t.name; render();
  }
  function commitEdit() {
    if (!editingId) return;
    var id = editingId, name = editDraft;
    editingId = null; editDraft = '';
    patch(id, { name: name });   // 中身が同じ／空なら patch が握りつぶす
    render();
  }
  function cancelEdit() { editingId = null; editDraft = ''; render(); }

  function removeTask(id) {
    var t = tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    tasks = tasks.filter(function (x) { return x.id !== id; }); save(K_TASKS, tasks);
    enqueue({ action: 'delete', id: id });
    offerUndo('削除しました', t, 'delete');
  }

  function offerUndo(msg, task, kind) {
    pendingUndo = { task: task, kind: kind };
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toast').classList.add('show');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideUndo, UNDO_MS - 200);
  }
  function hideUndo() { pendingUndo = null; document.getElementById('toast').classList.remove('show'); }

  function undo() {
    if (!pendingUndo) return;
    var t = pendingUndo.task;
    // まだ送信前ならキューから取り消すだけで済む
    queue = queue.filter(function (op) { return op.id !== t.id || op === inflight; });
    save(K_QUEUE, queue); localRev++;
    tasks.push(t); save(K_TASKS, tasks);
    hideUndo(); render();
  }

  // ---------- 描画 ----------
  function visible() {
    return tasks.filter(isActive).sort(function (a, b) {
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;          // 日付なしは末尾
      if (!b.date) return -1;
      return stampOf(a) < stampOf(b) ? -1 : 1; // 古い順＝放置が上
    });
  }
  function later() {
    return tasks.filter(function (x) { return !isActive(x); })
                .sort(function (a, b) { return stampOf(a) < stampOf(b) ? -1 : 1; });
  }

  function row(x, dim) {
    var late = isLate(x);
    var dcls = x.date ? (late ? ' late' : '') : ' nodate';
    return '<li data-id="' + x.id + '">' +
      '<button class="tick" data-act="done" aria-label="完了"></button>' +
      (editingId === x.id
        ? '<input type="text" class="nameedit" value="' + esc(editDraft) + '" aria-label="タスク名を変える" enterkeyhint="done">'
        : '<span class="name" data-act="rename"' + (dim ? ' style="opacity:.6"' : '') + '>' + esc(x.name) + '</span>') +
      '<span class="whenwrap">' +
        '<span class="when' + dcls + '">' + (x.date ? label(x.date) + (late ? ' から' : '') : '日付') + '</span>' +
        '<input type="date" class="rowdate" value="' + (x.date || '') + '" aria-label="有効化日を変える">' +
      '</span>' +
      // 時刻は日付があるときだけ意味を持つので、日付なしの行には出さない
      (x.date ? '<span class="whenwrap">' +
        '<span class="when' + (late ? ' late' : '') + (x.time ? '' : ' nodate') + '">' +
          (x.time ? timeLabel(x.time) : '時刻') + '</span>' +
        '<select class="rowtime" aria-label="有効化時刻を変える">' + hourOptions(x.time || '') + '</select>' +
      '</span>' : '') +
      '<button class="del" data-act="del" aria-label="削除">×</button></li>';
  }

  function render() {
    var app = document.getElementById('app');
    if (!api) { renderSetup(app); return; }

    var now = visible(), soon = later();
    var pending = queue.length;

    var html =
      '<header><h1>今やる</h1><span class="count">' + now.length + '件</span>' +
      '<span class="sync' + (pending ? ' pending' : '') + '">' +
      (pending ? '同期待ち ' + pending : '') + '</span></header>' +

      '<div class="composer">' +
        '<input type="text" id="txt" value="' + esc(draft) + '" placeholder="やること（例：銀行行く 明日）" autocomplete="off" enterkeyhint="done">' +
        '<div class="chips">' +
          chip('', 'なし') +
          '<input type="date" id="dpick" value="' + (pickedDate || '') + '">' +
          '<select class="chip tsel" id="tpick"' + (pickedDate ? '' : ' disabled') + '>' +
            hourOptions(pickedTime) + '</select>' +
          '<button class="chip add" id="addBtn">追加</button>' +
        '</div>' +
      '</div>' +

      (now.length ? '<ul id="list">' + now.map(function (x) { return row(x, false); }).join('') + '</ul>'
                  : '<div class="empty">今やることはありません 🎉</div>') +

      (soon.length ? '<button class="later-head" id="laterBtn">' + (showLater ? '▾' : '▸') +
                     ' あとで（' + soon.length + '）</button>' +
                     (showLater ? '<ul id="laterList">' + soon.map(function (x) { return row(x, true); }).join('') + '</ul>' : '')
                   : '') +
      '<div style="text-align:center;margin-top:28px"><button class="gear" id="gear">設定</button>' +
      '<span style="font-size:11px;color:var(--sub);margin-left:12px">' + BUILD + '</span></div>';

    var old = document.getElementById('txt');
    var hadFocus = !!old && document.activeElement === old;
    rendering = true;
    try { app.innerHTML = html; } finally { rendering = false; }
    bind(hadFocus);
  }

  function chip(val, text) {
    return '<button class="chip' + (pickedDate === val ? ' on' : '') +
           '" data-date="' + val + '">' + text + '</button>';
  }

  function renderSetup(app) {
    app.innerHTML =
      '<div class="setup"><h1>初期設定</h1>' +
      '<p>Apps Script で発行した<b>ウェブアプリのURL</b>を貼り付けてください。' +
      'この端末だけに保存されます（アプリのコードには含まれません）。</p>' +
      '<input type="url" id="apiIn" placeholder="https://script.google.com/macros/s/..../exec" value="' + esc(api) + '">' +
      '<button id="saveApi">保存する</button></div>';
    document.getElementById('saveApi').onclick = function () {
      var v = document.getElementById('apiIn').value.trim();
      if (!v) return;
      api = v; localStorage.setItem(K_API, v); render(); pull();
    };
  }

  /** 日付・時刻の選択状態だけを画面に反映する（描き直さない＝入力中の文字を壊さない） */
  function syncChips() {
    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-date]'), function (b) {
      if (b.getAttribute('data-date') === pickedDate) b.classList.add('on');
      else b.classList.remove('on');
    });
    var dp = document.getElementById('dpick');
    if (dp && dp.value !== pickedDate) dp.value = pickedDate;
    var tp = document.getElementById('tpick');
    if (tp) {
      tp.disabled = !pickedDate;      // 時刻は日付とセットでしか意味がない
      if (tp.value !== pickedTime) tp.value = pickedTime;
      tp.classList.toggle('on', !!pickedTime);
    }
  }

  function pickDate(v) {
    pickedDate = v;
    if (!v) pickedTime = '';
    syncChips();
    var txt = document.getElementById('txt');
    txt.focus();
    txt.setSelectionRange(txt.value.length, txt.value.length);
  }

  function bind(hadFocus) {
    var txt = document.getElementById('txt');
    txt.oninput = function () { draft = txt.value; };
    txt.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); addTask(); } };
    document.getElementById('addBtn').onclick = addTask;
    document.getElementById('dpick').onchange = function (e) { pickDate(e.target.value); };
    document.getElementById('tpick').onchange = function (e) { pickedTime = e.target.value; syncChips(); };

    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-date]'), function (b) {
      b.onclick = function () { pickDate(b.getAttribute('data-date')); };
    });

    Array.prototype.forEach.call(document.querySelectorAll('li'), function (li) {
      var id = li.getAttribute('data-id');
      var nm = li.querySelector('[data-act=rename]');
      if (nm) nm.onclick = function () { commitEdit(); startEdit(id); };
      var ne = li.querySelector('.nameedit');
      if (ne) {
        ne.oninput = function () { editDraft = ne.value; };
        ne.onkeydown = function (e) {
          if (e.isComposing || e.keyCode === 229) return;   // 日本語変換の確定Enterでは確定しない
          if (e.key === 'Enter') { e.preventDefault(); commitEdit(); }
          else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
        };
        // 他の場所を触ったら確定。ただし描き直しで消えただけのときは何もしない
        // （Chromeは要素を消す「直前」に blur を出すので document.contains では見分けられない）
        ne.onblur = function () { if (!rendering && document.contains(ne)) commitEdit(); };
      }
      li.querySelector('[data-act=done]').onclick = function () {
        li.classList.add('going'); setTimeout(function () { doneTask(id); render(); }, 160);
      };
      li.querySelector('[data-act=del]').onclick = function () {
        li.classList.add('going'); setTimeout(function () { removeTask(id); render(); }, 160);
      };
      var dp = li.querySelector('.rowdate');
      if (dp) {
        dp.onchange = function () { patch(id, { date: dp.value }); };
        // PCのChromeは入力欄を押しただけではカレンダーが開かないので明示的に開く
        dp.onclick = function () { if (dp.showPicker) { try { dp.showPicker(); } catch (e) {} } };
      }
      var tp = li.querySelector('.rowtime');
      if (tp) tp.onchange = function () { patch(id, { time: tp.value }); };
    });

    var lb = document.getElementById('laterBtn');
    if (lb) lb.onclick = function () { showLater = !showLater; render(); };

    document.getElementById('gear').onclick = function () {
      if (confirm('接続先URLを再設定しますか？（タスクは消えません）')) {
        localStorage.removeItem(K_API); api = ''; render();
      }
    };

    // 裏の同期で描き直しても、入力中ならカーソルを末尾に戻して続きを打てるようにする
    var editing = document.querySelector('.nameedit');
    if (editing) {
      editing.focus();
      editing.setSelectionRange(editing.value.length, editing.value.length);
    } else if (hadFocus || matchMedia('(pointer:fine)').matches) {
      txt.focus();
      txt.setSelectionRange(txt.value.length, txt.value.length);
    }
  }

  // ---------- 起動 ----------
  document.getElementById('toastUndo').onclick = undo;
  render();
  pull();
  if (queue.length) scheduleFlush(500);

  // 時間が進んだら（＝時が変わったら）出番の来たタスクを自動で出す
  var lastStamp = stampNow();
  setInterval(function () {
    var s = stampNow();
    if (s !== lastStamp) { lastStamp = s; render(); }
  }, 20000);

  window.addEventListener('online', function () { scheduleFlush(200); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { hideUndo(); flush(); }
    else { pull(); }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
